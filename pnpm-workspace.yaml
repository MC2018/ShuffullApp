# Workspace file. Today this repo is a single package (the Expo app at the root); the packages list
# below is where apps/* and packages/* get added as the web/desktop restructure lands.

# Hoisted layout: a flat, real node_modules like npm produces. React Native/Expo tooling (Metro,
# autolinking) assumes hoisting; pnpm's default isolated layout leaves peers like @react-navigation/*
# unreachable. NOTE: must live here — pnpm 11 ignores node-linker in .npmrc.
nodeLinker: hoisted

packages:
  - "."

# pnpm 11 runs dependency install/build scripts only for allowlisted packages.
# esbuild downloads its platform binary (vitest needs it); better-sqlite3 compiles its native addon;
# unrs-resolver fetches its resolver binary (eslint import plugin).
allowBuilds:
  esbuild: true
  better-sqlite3: true
  unrs-resolver: true

# Security overrides for transitive deps that upstream pins below the patched release.
# Each is a semver-compatible API for its consumer; re-check (and drop) on the next Expo SDK bump.
# - postcss: @expo/metro-config 54 pins ~8.4.32; 8.5 is a minor.
# - uuid: xcode (iOS prebuild only) still asks for ^7 but only calls uuid.v4(); 11.x keeps a CJS build.
# - esbuild: drizzle-kit's @esbuild-kit loader pulls 0.18 (dev-server CORS advisory); dev-only.
# Deliberately NOT overridden: image-size (2.x drops the file-path input Metro 0.83 passes),
# decode-uri-component (0.4+ is ESM-only; query-string 7 require()s it), braces / node-forge
# (no patched release exists).
overrides:
  postcss@<8.5.23: ^8.5.28
  xcode>uuid: ^11.1.1
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
